openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: employees
    description: Employee management
  - name: vacations
    description: Vacation management
  - name: dashboard
    description: Dashboard summary
  - name: me
    description: Current user profile and self-registration
  - name: notifications
    description: Notification center of the current user
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and redirect to the app
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "302":
          description: Redirect to the application root.
    post:
      tags: [Auth]
      operationId: logoutSession
      summary: End the current session
      description: >-
        Deletes the session record and clears the session cookie without
        redirecting the browser. This is the preferred way to sign out.
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Session ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkEnvelope"
  /auth/providers:
    get:
      tags: [Auth]
      operationId: listAuthProviders
      summary: List the external login providers configured in the API
      responses:
        "200":
          description: The available providers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProviders"
  /auth/google:
    get:
      tags: [Auth]
      operationId: startGoogleLogin
      summary: Redirect to the Google consent screen
      responses:
        "302":
          description: Redirect to the Google OAuth consent screen.
        "404":
          description: Google login is not configured on the server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/google/callback:
    get:
      tags: [Auth]
      operationId: completeGoogleLogin
      summary: Handle the Google OAuth callback and start the session
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the application root on success, or back to the login page with an `error` code.
  /auth/register-local:
    post:
      tags: [Auth]
      operationId: registerLocalUser
      summary: Create an account with e-mail and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalCredentialsBody"
      responses:
        "200":
          description: Account created and the session started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkEnvelope"
        "400":
          description: Invalid e-mail, e-mail outside the allowed company domain, or password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The e-mail is already registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/login-local:
    post:
      tags: [Auth]
      operationId: loginLocalUser
      summary: Sign in with e-mail and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalCredentialsBody"
      responses:
        "200":
          description: Authenticated and the session started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkEnvelope"
        "400":
          description: Missing credentials or e-mail outside the allowed company domain.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Invalid e-mail or password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      summary: Send a password reset link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailBody"
      responses:
        "200":
          description: The request was accepted (always, to avoid leaking registered e-mails).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkEnvelope"
        "400":
          description: Missing e-mail or e-mail outside the allowed company domain.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Set a new password using a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordBody"
      responses:
        "200":
          description: The password was changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkEnvelope"
        "400":
          description: Invalid or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /employees:
    get:
      operationId: listEmployees
      tags: [employees]
      summary: List all employees with vacation balance
      responses:
        "200":
          description: List of employees
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEmployeesResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: createEmployee
      tags: [employees]
      summary: Create a new employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmployeeBody"
      responses:
        "201":
          description: Employee created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeDetail"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /employees/{id}:
    get:
      operationId: getEmployee
      tags: [employees]
      summary: Get a single employee by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Employee found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    put:
      operationId: updateEmployee
      tags: [employees]
      summary: Update an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployeeBody"
      responses:
        "200":
          description: Employee updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeDetail"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteEmployee
      tags: [employees]
      summary: Delete an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Employee deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /employees/{id}/vacations:
    get:
      operationId: listEmployeeVacations
      tags: [vacations]
      summary: List vacations for an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of vacations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListVacationsResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: createVacation
      tags: [vacations]
      summary: Register a vacation period for an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVacationBody"
      responses:
        "201":
          description: Vacation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VacationItem"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /employees/{id}/password:
    put:
      operationId: updateEmployeePassword
      tags: [employees]
      summary: Change the password of an employee
      description: >-
        Changes the password of the account linked to the employee. The
        employee may change their own password (sending `currentPassword`) and
        managers may change the password of any employee. Changing the password
        revokes every other session of the account and invalidates the pending
        password reset tokens of that account.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployeePasswordBody"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageEnvelope"
        "400":
          description: Invalid employee ID, missing new password, new password rejected by the password policy or wrong current password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden - only the employee itself or a manager can change the password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Employee or linked user not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /employees/{id}/vacation-sales:
    get:
      operationId: listEmployeeVacationSales
      tags: [vacations]
      summary: List the vacation days sold by an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of vacation sales
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListVacationSalesResponse"
        "400":
          description: Invalid employee ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: createVacationSale
      tags: [vacations]
      summary: Register a sale of vacation days for an employee (managers only)
      description: >-
        Registers the sale of vacation days of an employee. The sold amount
        cannot exceed the current balance and is limited to one third of the
        accrual period (10 of 30 days) per operation.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVacationSaleBody"
      responses:
        "201":
          description: Vacation sale registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VacationSale"
        "400":
          description: Invalid input, insufficient balance or the per-operation limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden - manager role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /employees/{id}/vacation-sales/{saleId}:
    delete:
      operationId: deleteVacationSale
      tags: [vacations]
      summary: Delete a vacation sale record (managers only)
      description: >-
        Deletes a vacation sale and returns the sold days to the balance of the
        employee. The record is located by its own `saleId`; the `id` of the
        path is the employee the sale belongs to and is not used to filter the
        deletion.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: saleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Vacation sale deleted
        "400":
          description: Invalid sale ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden - manager role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Vacation sale not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /vacations:
    get:
      operationId: listVacations
      tags: [vacations]
      summary: List all vacations
      description: >-
        Lists every vacation record, including the name and the department of
        the employee it belongs to.
      parameters:
        - name: status
          in: query
          required: false
          description: Filters the list by status (`pending`, `approved` or `rejected`). When omitted, every status is returned.
          schema:
            type: string
      responses:
        "200":
          description: List of vacations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAllVacationsResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /vacations/{id}:
    put:
      operationId: updateVacation
      tags: [vacations]
      summary: Edit a pending vacation request
      description: >-
        Edits the period of a vacation request. Only the employee that owns the
        request can edit it and only while the request is still pending. The
        new period cannot overlap another pending or approved vacation of the
        same employee.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVacationBody"
      responses:
        "200":
          description: Vacation updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VacationItem"
        "400":
          description: Invalid input, missing dates, end date before the start date or overlapping period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden - only the owner can edit a pending request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteVacation
      tags: [vacations]
      summary: Delete a vacation period
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Vacation deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary statistics
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /vacations/{id}/status:
    put:
      operationId: updateVacationStatus
      tags: [vacations]
      summary: Approve or reject a vacation request (managers only)
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVacationStatusBody"
      responses:
        "200":
          description: Vacation status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VacationItem"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - manager role required
        "404":
          description: Vacation not found

  /me/employee:
    get:
      operationId: getMyEmployee
      tags: [me]
      summary: Get the employee record linked to the current user
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Employee record or null if not registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyEmployeeEnvelope"
        "401":
          description: Unauthorized

    post:
      operationId: registerAsEmployee
      tags: [me]
      summary: Self-register the current user as an employee
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterEmployeeBody"
      responses:
        "201":
          description: Employee registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyEmployeeEnvelope"
        "400":
          description: Invalid input or user already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List the notifications of the current user
      description: Returns the 30 most recent notifications of the authenticated user, newest first.
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListNotificationsResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /notifications/read-all:
    put:
      operationId: markAllNotificationsAsRead
      tags: [notifications]
      summary: Mark every notification of the current user as read
      responses:
        "200":
          description: Notifications marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /notifications/{id}/read:
    put:
      operationId: markNotificationAsRead
      tags: [notifications]
      summary: Mark a single notification of the current user as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Notification marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkEnvelope"
        "400":
          description: Invalid notification ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Notification not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl, isManager]
      properties:
        id:
          type: string
        email:
          type: [string, "null"]
          format: email
        firstName:
          type: [string, "null"]
        lastName:
          type: [string, "null"]
        profileImageUrl:
          type: [string, "null"]
        isManager:
          type: boolean
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    AuthProviders:
      type: object
      required: [google]
      properties:
        google:
          type: boolean
          description: Whether the Google login is configured on the server.
    LocalCredentialsBody:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
    EmailBody:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordBody:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 10
    OkEnvelope:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true
    MessageEnvelope:
      type: object
      required: [message]
      properties:
        message:
          type: string
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    EmployeeWithBalance:
      type: object
      required:
        [
          id,
          name,
          role,
          department,
          hireDate,
          createdAt,
          vacationBalanceDays,
          daysUntilNextVacation,
          isOnVacation,
          nextVacationStart,
        ]
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string
        department:
          type: string
        hireDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
        vacationBalanceDays:
          type: number
          description: Available vacation days (earned - taken - sold)
        daysUntilNextVacation:
          type: number
          description: Days until the next accrual anniversary (the day the balance grows again)
        isOnVacation:
          type: boolean
        nextVacationStart:
          type: [string, "null"]
          format: date
        eligibleForVacation:
          type: boolean
          description: Whether the employee already reached the minimum balance to request a vacation
        firstEligibilityDate:
          type: string
          format: date
          description: First date on which the employee reached the minimum balance
        daysSold:
          type: number
          description: Vacation days already sold by the employee

